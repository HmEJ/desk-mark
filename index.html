<canvas id="canvas"></canvas>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden !important; /* 🔥 关键 */
        background: transparent;
    }

    canvas {
        display: block; /* 🔥 防止 inline 元素多 2px */
    }
</style>


<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let timer = null;
    let visible = true;

    let config = {
        text: 'CONFIDENTIAL',
        angle: -45,
        fontSize: 32,
        gap: 200,
        opacity: 0.15,
        color: '#000',
        fontFamily: 'Alibaba',
        stretchX: 1,
        stretchY: 1
    };

    function resize() {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
        draw();
    }

    resize();
    addEventListener('resize', resize);

    function shouldAutoRefresh(template) {
        return /\$\{(time|date)\}/.test(template || '');
    }

    function setupTimer() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }

        if (shouldAutoRefresh(config.text) && visible) {
            timer = setInterval(draw, 1000);
        }
    }

    function createPatternTile(text) {
        const tile = document.createElement('canvas');
        const tctx = tile.getContext('2d');
        tctx.font = `${config.fontSize}px ${config.fontFamily}`;

        const stretchX = Math.max(0.5, Math.min(3, Number(config.stretchX || 1)));
        const stretchY = Math.max(0.5, Math.min(3, Number(config.stretchY || 1)));

        const textWidth = Math.ceil(tctx.measureText(text).width);
        const stepX = Math.max(1, Math.ceil(textWidth * stretchX) + Number(config.gap || 0));
        const stepY = Math.max(1, Math.ceil(Number(config.fontSize || 0) * stretchY) + Number(config.gap || 0));

        tile.width = stepX;
        tile.height = stepY;

        tctx.globalAlpha = Number(config.opacity);
        tctx.fillStyle = config.color;
        tctx.font = `${config.fontSize}px ${config.fontFamily}`;
        tctx.textBaseline = 'top';
        tctx.save();
        tctx.scale(stretchX, stretchY);
        tctx.fillText(text, 0, 0);
        tctx.restore();

        return tile;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!visible) {
            return;
        }

        const text = resolveTemplate(config.text);
        const tile = createPatternTile(text);
        const pattern = ctx.createPattern(tile, 'repeat');

        if (!pattern) {
            return;
        }

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(config.angle * Math.PI / 180);
        ctx.fillStyle = pattern;
        ctx.fillRect(-canvas.width * 2, -canvas.height * 2, canvas.width * 4, canvas.height * 4);
        ctx.restore();
    }

    function resolveTemplate(template) {
        const now = new Date();

        const pad = n => n.toString().padStart(2, '0');

        const vars = {
            time: `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} `
                + `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
            date: `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`,
            username: window.runtime?.username || 'Unknown',
            hostname: window.runtime?.hostname || 'PC'
        };

        return template.replace(/\$\{(\w+)\}/g, (_, key) => vars[key] ?? '');
    }


    window.api.onConfig(cfg => {
        Object.assign(config, cfg);
        setupTimer();
        draw();
    });
    window.api.onVisibility(nextVisible => {
        visible = !!nextVisible;
        setupTimer();
        draw();
    });

</script>
